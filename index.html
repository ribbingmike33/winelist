<meta name="theme-color" content="#173f2b">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --green:#173f2b;
  --green-2:#24553c;
  --red:#9d2638;
  --cream:#f6f2e9;
  --paper:#fffdf8;
  --ink:#292a27;
  --muted:#77746d;
  --line:#ddd7ca;
  --gold:#c8a45d;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);background:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  text-align:center;color:#fffdf8;background:var(--green);
  padding:52px 20px 45px;border-bottom:6px solid var(--red);
}
.header-mark{
  width:58px;height:4px;background:linear-gradient(90deg,var(--green) 0 33%,#fff 33% 66%,var(--red) 66%);
  margin:0 auto 20px;border:1px solid rgba(255,255,255,.35);
}
h1{
  margin:0;font-family:Georgia,"Times New Roman",serif;
  font-size:45px;font-weight:400;letter-spacing:.8px;
}
header p{
  margin:10px 0 0;color:#dfe8df;font-family:Georgia,"Times New Roman",serif;
  font-size:16px;font-style:italic;letter-spacing:.7px;
}
.container{max-width:1080px;margin:40px auto;padding:0 22px}
.card{
  background:var(--paper);border:1px solid var(--line);
  box-shadow:0 8px 28px rgba(38,42,35,.055);
}
.submit-card{padding:28px;margin-bottom:38px}
.section-title,.toolbar h2{
  font-family:Georgia,"Times New Roman",serif;font-weight:400;
}
.section-title{margin:0 0 20px;font-size:27px}
.section-title:after{
  content:"";display:block;width:42px;height:2px;background:var(--red);margin-top:10px;
}
form{
  display:grid;grid-template-columns:minmax(0,1fr) 145px 155px;
  gap:13px;align-items:end;
}
label{
  display:block;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:7px;color:#504f49;
}
input,select,button{
  width:100%;max-width:100%;min-width:0;min-height:46px;padding:11px 13px;
  border:1px solid #cfc8ba;border-radius:3px;font:inherit;background:#fff;
}
input:focus,select:focus{outline:2px solid rgba(36,85,60,.18);border-color:var(--green-2)}
button{
  cursor:pointer;border:none;background:var(--green);color:white;font-weight:700;
}
button:hover{background:var(--green-2)}
button:disabled{opacity:.55;cursor:wait}
.photo-tools{margin-top:17px;display:flex;gap:10px;flex-wrap:wrap}
.photo-btn{
  display:inline-flex;align-items:center;justify-content:center;width:auto;
  min-height:42px;padding:9px 15px;border:1px solid var(--green);
  background:white;color:var(--green);font-size:13px;
}
.photo-btn:hover{background:#f0f5f0}
#photos,#cameraInput{display:none}
#wineDate{width:100%;max-width:100%;min-width:0;display:block;-webkit-appearance:none;appearance:none}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview img{width:78px;height:78px;object-fit:cover;border:1px solid var(--line)}
.status{min-height:20px;margin-top:12px;color:var(--muted);font-size:13px}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px
}
.toolbar h2{margin:0;font-size:29px}
.toolbar select{width:200px;background:var(--paper)}
.wine-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:21px
}
.wine{
  overflow:hidden;background:var(--paper);border:1px solid var(--line);
  box-shadow:0 7px 24px rgba(38,42,35,.06)
}
.wine-photo{
  height:235px;background:#e9e4d8;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px
}
.wine-photo img{width:100%;height:100%;object-fit:cover}
.wine-body{padding:19px}
.wine-name{font-family:Georgia,"Times New Roman",serif;font-size:23px;line-height:1.2;margin-bottom:8px}
.wine-date{font-size:12px;color:var(--muted);margin-bottom:14px}
.rank-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rank{
  padding:6px 10px;background:#f1ebe0;color:var(--green);
  font-size:13px;font-weight:800;border-left:3px solid var(--red)
}
.actions{display:flex;gap:8px;margin-top:15px}
.actions button{width:auto;min-height:auto;padding:8px 12px;font-size:12px}
.edit-btn{background:var(--green-2)}
.delete-btn{background:#f1ebe8;color:var(--red)}
.empty{
  grid-column:1/-1;padding:55px 20px;text-align:center;
  background:var(--paper);border:1px solid var(--line);color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;font-style:italic
}
.error{color:var(--red)}
@media(max-width:700px){
  header{padding:44px 15px 39px} h1{font-size:35px}
  form{grid-template-columns:1fr}
  .toolbar{align-items:stretch;flex-direction:column;gap:12px}
  .toolbar select{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="header-mark"></div>
  <h1>La Cantina di Zach</h1>
  <p>Zach's Italian Wine Collection</p>
</header>

<main class="container">
  <section class="submit-card card">
    <h2 class="section-title">Add a Wine</h2>
    <form id="wineForm">
      <div>
        <label for="name">Wine Name</label>
        <input id="name" type="text" placeholder="e.g. 2019 Barolo" required>
      </div>
      <div>
        <label for="ranking">Score</label>
        <input id="ranking" type="number" inputmode="decimal" min="0" max="100" step="0.1" placeholder="95" required>
      </div>
      <div>
        <label for="wineDate">Date</label>
        <input id="wineDate" type="date" required>
      </div>
      <button id="addButton" type="submit">Add Wine</button>
    </form>

    <div class="photo-tools">
      <label class="photo-btn" for="cameraInput">Take Photo</label>
      <label class="photo-btn" for="photos">Choose Photos</label>
      <input id="cameraInput" type="file" accept="image/*" capture="environment">
      <input id="photos" type="file" accept="image/*" multiple>
    </div>
    <div id="preview" class="preview"></div>
    <div id="status" class="status"></div>
  </section>

  <div class="toolbar">
    <h2>Wine Rankings</h2>
    <select id="sort">
      <option value="high">Highest Score</option>
      <option value="low">Lowest Score</option>
      <option value="new">Newest</option>
    </select>
  </div>

  <section id="wineGrid" class="wine-grid"></section>
</main>

<script>
const SUPABASE_URL="https://ccqtmehximiwandjtkib.supabase.co";
const SUPABASE_KEY="sb_publishable_GDQ7sOrz7Ji71pZQWG1Czg_rSsbn7uv";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET="wine-photos";

let wines=[];
let selectedPhotos=[];

const form=document.getElementById("wineForm");
const photos=document.getElementById("photos");
const cameraInput=document.getElementById("cameraInput");
const preview=document.getElementById("preview");
const grid=document.getElementById("wineGrid");
const sort=document.getElementById("sort");
const statusEl=document.getElementById("status");
const addButton=document.getElementById("addButton");
const wineDate=document.getElementById("wineDate");

function todayLocal(){
  const d=new Date();
  const offset=d.getTimezoneOffset();
  return new Date(d.getTime()-offset*60000).toISOString().slice(0,10);
}
wineDate.value=todayLocal();

function setStatus(text,error=false){
  statusEl.textContent=text||"";
  statusEl.className="status"+(error?" error":"");
}

async function loadWines(){
  setStatus("Loading cellar…");
  const {data,error}=await supabaseClient.from("wines").select("*");
  if(error){
    setStatus("Could not load the cellar: "+error.message,true);
    grid.innerHTML='<div class="empty">Unable to load the wine cellar.</div>';
    return;
  }
  wines=data||[];
  setStatus("");
  render();
}

function getPhotos(wine){
  if(Array.isArray(wine.photos)) return wine.photos;
  if(typeof wine.photos==="string"){
    try{return JSON.parse(wine.photos)||[]}catch(e){return []}
  }
  return [];
}

function formatDate(value){
  if(!value)return "";
  const d=new Date(value+"T12:00:00");
  return d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}

async function handlePhotoFiles(fileList){
  const files=[...fileList];
  if(!files.length)return;
  for(const file of files){
    selectedPhotos.push(file);
    const url=URL.createObjectURL(file);
    const img=document.createElement("img");
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    preview.appendChild(img);
  }
}

photos.addEventListener("change",()=>handlePhotoFiles(photos.files));
cameraInput.addEventListener("change",()=>handlePhotoFiles(cameraInput.files));

async function uploadPhotos(wineId){
  const urls=[];
  for(const file of selectedPhotos){
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"-");
    const path=wineId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+safe;
    const {error}=await supabaseClient.storage.from(BUCKET).upload(path,file,{upsert:false});
    if(error)throw error;
    const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);
    urls.push(data.publicUrl);
  }
  return urls;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  const score=Number(document.getElementById("ranking").value);
  const date=wineDate.value||todayLocal();

  if(!name||!Number.isFinite(score)||score<0||score>100)return;

  addButton.disabled=true;
  addButton.textContent="Saving…";
  setStatus("Saving wine…");

  try{
    const id=Date.now();
    let photoUrls=[];
    if(selectedPhotos.length){
      photoUrls=await uploadPhotos(id);
    }

    const {error}=await supabaseClient.from("wines").insert({
      id,
      name,
      score,
      wine_date:date,
      photos:photoUrls,
      created_at:new Date().toISOString()
    });
    if(error)throw error;

    form.reset();
    wineDate.value=todayLocal();
    photos.value="";
    cameraInput.value="";
    selectedPhotos=[];
    preview.innerHTML="";
    setStatus("Wine added.");
    await loadWines();
  }catch(error){
    console.error(error);
    setStatus("Could not save wine: "+error.message,true);
  }finally{
    addButton.disabled=false;
    addButton.textContent="Add Wine";
  }
});

sort.addEventListener("change",render);

async function editWine(id){
  const wine=wines.find(w=>String(w.id)===String(id));
  if(!wine)return;
  const name=prompt("Wine name:",wine.name);
  if(name===null)return;
  const score=prompt("Score (0-100):",wine.score);
  if(score===null)return;
  const value=Number(score);
  if(!name.trim()||!Number.isFinite(value)||value<0||value>100){
    alert("Please enter a wine name and a score from 0 to 100.");
    return;
  }
  const {error}=await supabaseClient.from("wines").update({
    name:name.trim(),score:value
  }).eq("id",id);
  if(error){alert("Could not update wine: "+error.message);return}
  await loadWines();
}

async function deleteWine(id){
  const wine=wines.find(w=>String(w.id)===String(id));
  if(!wine||!confirm('Delete "'+wine.name+'"?'))return;
  const {error}=await supabaseClient.from("wines").delete().eq("id",id);
  if(error){alert("Could not delete wine: "+error.message);return}
  await loadWines();
}

function render(){
  let list=[...wines];
  if(sort.value==="high")list.sort((a,b)=>Number(b.score)-Number(a.score));
  if(sort.value==="low")list.sort((a,b)=>Number(a.score)-Number(b.score));
  if(sort.value==="new")list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  if(!list.length){
    grid.innerHTML='<div class="empty">No wines yet. Add the first bottle to the cellar.</div>';
    return;
  }

  grid.innerHTML=list.map((wine,index)=>{
    const photos=getPhotos(wine);
    return `
      <article class="wine">
        <div class="wine-photo">
          ${photos.length
            ?'<img src="'+escapeHtml(photos[0])+'" alt="'+escapeHtml(wine.name)+'">'
            :'No photo added'}
        </div>
        <div class="wine-body">
          <div class="wine-name">${escapeHtml(wine.name)}</div>
          <div class="wine-date">${formatDate(wine.wine_date)}</div>
          <div class="rank-row">
            <span class="rank">#${index+1} · ${Number(wine.score).toFixed(Number(wine.score)%1?1:0)}/100</span>
          </div>
          <div class="actions">
            <button class="edit-btn" type="button" onclick="editWine('${wine.id}')">Edit</button>
            <button class="delete-btn" type="button" onclick="deleteWine('${wine.id}')">Delete</button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

loadWines();
</script>
</body>
</html>
