<style>
:root{
  --green:#163f2b;
  --green-dark:#0e2e20;
  --green-soft:#e7eee8;
  --red:#a3293d;
  --red-dark:#842032;
  --cream:#e9e2d3;
  --paper:#f8f4ea;
  --paper-2:#f1ebdf;
  --ink:#252722;
  --muted:#716f67;
  --line:#d4cdbf;
  --gold:#b59655;
  --white:#fffdf8;
  --shadow:0 10px 28px rgba(39,45,38,.09);
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
header{position:relative;overflow:hidden;background:var(--green);color:var(--white);padding:54px 20px 52px;text-align:center}
header:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 42%,rgba(163,41,61,.07));pointer-events:none}
header:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--green) 0 33.33%,var(--white) 33.33% 66.66%,var(--red) 66.66%)}
.header-mark{position:relative;width:74px;height:4px;margin:0 auto 22px;background:linear-gradient(90deg,var(--green-soft) 0 33.33%,var(--white) 33.33% 66.66%,var(--red) 66.66%);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
h1{position:relative;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:43px;font-weight:400;letter-spacing:.1px;line-height:1.1}
header p{position:relative;margin:12px 0 0;color:#dce5de;font-family:Georgia,"Times New Roman",serif;font-size:16px;font-style:italic;letter-spacing:1.4px}
.container{max-width:1120px;margin:0 auto;padding:0 26px 70px}
.tabs{display:flex;justify-content:center;gap:0;margin:0 0 42px;border-bottom:1px solid var(--line);background:rgba(248,244,234,.72)}
.tab{position:relative;width:230px;min-height:62px;padding:16px 24px;border:0;border-radius:0;background:transparent;color:#77756e;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;cursor:pointer}
.tab:after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:3px;background:transparent}
.tab:hover{color:var(--green);background:rgba(22,63,43,.035)}
.tab.active{color:var(--green)}
.tab.active:after{background:var(--red)}
.tab-icon{display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center}
.tab-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#leaderboardTab .tab-icon svg{fill:currentColor;stroke:none}
.tab-panel.hidden{display:none}
.card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.submit-card{padding:34px 36px 30px;margin-bottom:42px;border-top:3px solid var(--green)}
.section-title,.toolbar h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;color:var(--green-dark)}
.section-title{margin:0 0 28px;font-size:30px;line-height:1.15}
.section-title:after{content:"";display:block;width:42px;height:2px;background:var(--red);margin-top:13px}
form{display:grid;grid-template-columns:minmax(0,1fr) 115px 145px 145px 130px;gap:14px;align-items:end}
label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.35px;margin:0 0 8px;color:#595953}
input,select{width:100%;max-width:100%;min-width:0;box-sizing:border-box;height:48px;padding:11px 13px;border:1px solid #c9c2b6;border-radius:2px;background:var(--white);color:var(--ink);box-shadow:inset 0 1px 1px rgba(0,0,0,.025)}
input::placeholder{color:#aaa69e}

button{cursor:pointer}

.photo-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.photo-btn{display:inline-flex;align-items:center;justify-content:center;width:auto;min-height:39px;padding:8px 15px;border:1px solid #bcb6aa;background:transparent;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.75px;text-transform:uppercase;cursor:pointer}
.photo-btn:hover{background:var(--green-soft);border-color:#9faf9f}
#photos,#cameraInput{display:none}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.preview img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line)}
.status{min-height:20px;margin-top:11px;color:var(--muted);font-size:12px}.error{color:var(--red)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.toolbar h2{margin:0;font-size:30px}
.toolbar select{width:190px;height:42px;background:var(--paper);font-size:12px;font-weight:600}
.wine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:22px}
.wine{overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}.wine:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(39,45,38,.12)}
.wine-photo{height:245px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:#98948b;font-size:10px;text-transform:uppercase;letter-spacing:1.3px}.wine-photo img{width:100%;height:100%;object-fit:cover}
.wine-body{padding:21px 21px 19px}.wine-name{font-family:Georgia,"Times New Roman",serif;font-size:23px;line-height:1.2;color:var(--green-dark);margin-bottom:9px}.wine-date{font-size:12px;color:var(--muted);margin-bottom:5px}.wine-logged{font-size:10px;color:#807d74;text-transform:uppercase;letter-spacing:1px}
.rank-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.rank{padding:7px 10px;background:#e8eee9;color:var(--green);font-size:12px;font-weight:800;border-left:3px solid var(--red)}
.actions{display:flex;gap:8px;margin-top:15px}.actions button{width:auto;min-height:34px;padding:7px 12px;font-size:10px;font-weight:800;letter-spacing:.75px;text-transform:uppercase}.edit-btn{background:var(--green);color:#fff;border:1px solid var(--green)}.edit-btn:hover{background:var(--green-dark)}.delete-btn{background:transparent;color:var(--red);border:1px solid #d4c1c1}.delete-btn:hover{background:#f5e9e8}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;background:var(--paper);border:1px solid var(--line);color:var(--muted);font-family:Georgia,"Times New Roman",serif;font-style:italic}
.leaderboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-bottom:36px} .leader-wines{margin-top:24px;border-top:1px solid var(--line);text-align:left}.leader-wine{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.leader-wine-name{font-family:Georgia,"Times New Roman",serif;font-size:16px;color:var(--green-dark)}.leader-wine-meta{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.leader-empty{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);font-style:italic}.leader-card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);padding:38px 28px 34px;text-align:center;box-shadow:var(--shadow)}.leader-card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--green)}.leader-card:last-child:before{background:var(--red)}.leader-name{font-family:Georgia,"Times New Roman",serif;font-size:32px;color:var(--green-dark);margin-bottom:13px}.leader-count{font-size:54px;font-weight:700;line-height:1;color:var(--green)}.leader-card:last-child .leader-count{color:var(--red)}.leader-label{margin-top:10px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px}
#wineDate{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;padding-right:10px;font-size:16px}
#wineDate::-webkit-date-and-time-value{text-align:left}
#wineDate::-webkit-calendar-picker-indicator{margin:0}
@media(max-width:850px){form{grid-template-columns:minmax(0,1fr) 110px 135px 135px 125px}.submit-card{padding:28px 25px}}
@media(max-width:700px){header{padding:43px 18px 40px}h1{font-size:34px;line-height:1.12}header p{font-size:14px;letter-spacing:1px}.container{padding:0 15px 55px}.tabs{margin-bottom:30px}.tab{flex:1;width:auto;min-height:57px;padding:14px 8px;font-size:11px;letter-spacing:.7px}.tab:after{left:8px;right:8px}.submit-card{padding:24px 18px 21px;margin-bottom:32px}form{grid-template-columns:1fr;gap:14px}.section-title{font-size:28px;margin-bottom:24px}form>button{margin-top:2px}.photo-tools{margin-top:16px;padding-top:16px}.photo-btn{flex:1}.toolbar{align-items:stretch;flex-direction:column;gap:12px;margin-bottom:15px}.toolbar h2{font-size:28px}.toolbar select{width:100%}.wine-grid{grid-template-columns:1fr;gap:16px}.wine-photo{height:255px}.leaderboard{grid-template-columns:1fr;gap:14px}.leader-card{padding:32px 24px}.leader-name{font-size:29px}}
</style>
</head>
<body>
<header>
  <div class="header-mark"></div>
  <h1>Zach &amp; Yeags Wine Cellar</h1>
  <p>Italian Wine Collection</p>
</header>

<main class="container">
  <nav class="tabs" aria-label="Wine cellar navigation">
    <button class="tab active" id="logTab" type="button"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h10l-1 7c-.3 2.2-1.7 3.7-4 4v5h3v2H9v-2h3v-5c-2.3-.3-3.7-1.8-4-4L7 3Z"/><path d="M7.5 8h9"/></svg></span><span>Log a Wine</span></button>
    <button class="tab" id="leaderboardTab" type="button"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20V10h4v10H5Zm5 0V4h4v16h-4Zm5 0v-7h4v7h-4Z"/></svg></span><span>Leaderboard</span></button>
  </nav>

  <section id="logPanel" class="tab-panel">
  <section class="submit-card card">
    <h2 class="section-title">Add a Wine</h2>
    <form id="wineForm">
      <div>
        <label for="name">Wine Name</label>
        <input id="name" type="text" placeholder="e.g. 2019 Barolo" required>
      </div>
      <div>
        <label for="ranking">Score</label>
        <input id="ranking" type="number" inputmode="decimal" min="0" max="100" step="0.1" placeholder="95" required>
      </div>
      <div>
        <label for="wineDate">Date</label>
        <input id="wineDate" type="date" required>
      </div>
      <div>
        <label for="loggedBy">Logged By</label>
        <select id="loggedBy" required>
          <option value="Zach">Zach</option>
          <option value="Yeags">Yeags</option>
        </select>
      </div>
      <button id="addButton" type="submit">Add Wine</button>
    </form>

    <div class="photo-tools">
      <label class="photo-btn" for="cameraInput">Take Photo</label>
      <label class="photo-btn" for="photos">Choose Photos</label>
      <input id="cameraInput" type="file" accept="image/*" capture="environment">
      <input id="photos" type="file" accept="image/*" multiple>
    </div>
    <div id="preview" class="preview"></div>
    <div id="status" class="status"></div>
  </section>

  <div class="toolbar">
    <h2>Wine Rankings</h2>
    <select id="sort">
      <option value="high">Highest Score</option>
      <option value="low">Lowest Score</option>
      <option value="new">Newest</option>
    </select>
  </div>

  <section id="wineGrid" class="wine-grid"></section>
  </section>

  <section id="leaderboardPanel" class="tab-panel hidden">
    <div class="toolbar">
      <h2>Leaderboard</h2>
    </div>
    <div id="leaderboard" class="leaderboard"></div>
  </section>
</main>

<script>
const SUPABASE_URL="https://ccqtmehximiwandjtkib.supabase.co";
const SUPABASE_KEY="sb_publishable_GDQ7sOrz7Ji71pZQWG1Czg_rSsbn7uv";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET="wine-photos";

let wines=[];
let selectedPhotos=[];

const form=document.getElementById("wineForm");
const photos=document.getElementById("photos");
const cameraInput=document.getElementById("cameraInput");
const preview=document.getElementById("preview");
const grid=document.getElementById("wineGrid");
const sort=document.getElementById("sort");
const statusEl=document.getElementById("status");
const addButton=document.getElementById("addButton");
const wineDate=document.getElementById("wineDate");
const loggedBy=document.getElementById("loggedBy");
const logTab=document.getElementById("logTab");
const leaderboardTab=document.getElementById("leaderboardTab");
const logPanel=document.getElementById("logPanel");
const leaderboardPanel=document.getElementById("leaderboardPanel");
const leaderboard=document.getElementById("leaderboard");

function todayLocal(){
  const d=new Date();
  const offset=d.getTimezoneOffset();
  return new Date(d.getTime()-offset*60000).toISOString().slice(0,10);
}
wineDate.value=todayLocal();

function setStatus(text,error=false){
  statusEl.textContent=text||"";
  statusEl.className="status"+(error?" error":"");
}

async function loadWines(){
  setStatus("Loading cellar…");
  const {data,error}=await supabaseClient.from("wines").select("*");
  if(error){
    setStatus("Could not load the cellar: "+error.message,true);
    grid.innerHTML='<div class="empty">Unable to load the wine cellar.</div>';
    return;
  }
  wines=data||[];
  setStatus("");
  render();
  renderLeaderboard();
}

function getPhotos(wine){
  if(Array.isArray(wine.photos)) return wine.photos;
  if(typeof wine.photos==="string"){
    try{return JSON.parse(wine.photos)||[]}catch(e){return []}
  }
  return [];
}

function formatDate(value){
  if(!value)return "";
  const d=new Date(value+"T12:00:00");
  return d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}

async function handlePhotoFiles(fileList){
  const files=[...fileList];
  if(!files.length)return;
  for(const file of files){
    selectedPhotos.push(file);
    const url=URL.createObjectURL(file);
    const img=document.createElement("img");
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    preview.appendChild(img);
  }
}

photos.addEventListener("change",()=>handlePhotoFiles(photos.files));
cameraInput.addEventListener("change",()=>handlePhotoFiles(cameraInput.files));

async function uploadPhotos(wineId){
  const urls=[];
  for(const file of selectedPhotos){
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"-");
    const path=wineId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+safe;
    const {error}=await supabaseClient.storage.from(BUCKET).upload(path,file,{upsert:false});
    if(error)throw error;
    const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);
    urls.push(data.publicUrl);
  }
  return urls;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  const score=Number(document.getElementById("ranking").value);
  const date=wineDate.value||todayLocal();
  const loggedByValue=loggedBy.value;

  if(!name||!Number.isFinite(score)||score<0||score>100||!loggedByValue)return;

  addButton.disabled=true;
  addButton.textContent="Saving…";
  setStatus("Saving wine…");

  try{
    const id=Date.now();
    let photoUrls=[];
    if(selectedPhotos.length){
      photoUrls=await uploadPhotos(id);
    }

    const {error}=await supabaseClient.from("wines").insert({
      id,
      name,
      score,
      wine_date:date,
      photos:photoUrls,
      logged_by:loggedByValue,
      created_at:new Date().toISOString()
    });
    if(error)throw error;

    form.reset();
    wineDate.value=todayLocal();
    loggedBy.value="Zach";
    photos.value="";
    cameraInput.value="";
    selectedPhotos=[];
    preview.innerHTML="";
    setStatus("Wine added.");
    await loadWines();
  }catch(error){
    console.error(error);
    setStatus("Could not save wine: "+error.message,true);
  }finally{
    addButton.disabled=false;
    addButton.textContent="Add Wine";
  }
});

function renderLeaderboard(){
  const people=["Zach","Yeags"];
  leaderboard.innerHTML=people.map(name=>{
    const logged=wines
      .filter(w=>String(w.logged_by||"").toLowerCase()===name.toLowerCase())
      .sort((a,b)=>new Date(b.wine_date)-new Date(a.wine_date));
    const list=logged.length
      ? `<div class="leader-wines">${logged.map(w=>`
          <div class="leader-wine">
            <span class="leader-wine-name">${escapeHtml(w.name)}</span>
            <span class="leader-wine-meta">${Number(w.score).toFixed(Number(w.score)%1?1:0)} · ${formatDate(w.wine_date)}</span>
          </div>`).join("")}</div>`
      : '<div class="leader-empty">No wines logged yet.</div>';
    return `
      <article class="leader-card">
        <div class="leader-name">${name}</div>
        <div class="leader-count">${logged.length}</div>
        <div class="leader-label">Wines logged</div>
        ${list}
      </article>
    `;
  }).join("");
}

function showTab(tab){
  const isLog=tab==="log";
  logPanel.classList.toggle("hidden",!isLog);
  leaderboardPanel.classList.toggle("hidden",isLog);
  logTab.classList.toggle("active",isLog);
  leaderboardTab.classList.toggle("active",!isLog);
  if(!isLog)renderLeaderboard();
}

logTab.addEventListener("click",()=>showTab("log"));
leaderboardTab.addEventListener("click",()=>showTab("leaderboard"));

sort.addEventListener("change",render);

async function editWine(id){
  const wine=wines.find(w=>String(w.id)===String(id));
  if(!wine)return;
  const name=prompt("Wine name:",wine.name);
  if(name===null)return;
  const score=prompt("Score (0-100):",wine.score);
  if(score===null)return;
  const value=Number(score);
  if(!name.trim()||!Number.isFinite(value)||value<0||value>100){
    alert("Please enter a wine name and a score from 0 to 100.");
    return;
  }
  const {error}=await supabaseClient.from("wines").update({
    name:name.trim(),score:value
  }).eq("id",id);
  if(error){alert("Could not update wine: "+error.message);return}
  await loadWines();
}

async function deleteWine(id){
  const wine=wines.find(w=>String(w.id)===String(id));
  if(!wine||!confirm('Delete "'+wine.name+'"?'))return;
  const {error}=await supabaseClient.from("wines").delete().eq("id",id);
  if(error){alert("Could not delete wine: "+error.message);return}
  await loadWines();
}

function render(){
  let list=[...wines];
  if(sort.value==="high")list.sort((a,b)=>Number(b.score)-Number(a.score));
  if(sort.value==="low")list.sort((a,b)=>Number(a.score)-Number(b.score));
  if(sort.value==="new")list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  if(!list.length){
    grid.innerHTML='<div class="empty">No wines yet. Add the first bottle to the cellar.</div>';
    return;
  }

  grid.innerHTML=list.map((wine,index)=>{
    const photos=getPhotos(wine);
    return `
      <article class="wine">
        <div class="wine-photo">
          ${photos.length
            ?'<img src="'+escapeHtml(photos[0])+'" alt="'+escapeHtml(wine.name)+'">'
            :'No photo added'}
        </div>
        <div class="wine-body">
          <div class="wine-name">${escapeHtml(wine.name)}</div>
          <div class="wine-date">${formatDate(wine.wine_date)}</div>
          <div class="wine-logged">Logged by ${escapeHtml(wine.logged_by||"—")}</div>
          <div class="rank-row">
            <span class="rank">#${index+1} · ${Number(wine.score).toFixed(Number(wine.score)%1?1:0)}/100</span>
          </div>
          <div class="actions">
            <button class="edit-btn" type="button" onclick="editWine('${wine.id}')">Edit</button>
            <button class="delete-btn" type="button" onclick="deleteWine('${wine.id}')">Delete</button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

loadWines();
</script>
</body>
</html>
